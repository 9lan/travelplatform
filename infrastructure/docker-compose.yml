version: '3.8'

services:
  # ─────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────
  postgres-shuttle:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shuttle
      POSTGRES_PASSWORD: shuttle_dev
      POSTGRES_DB: shuttle
    ports:
      - "5432:5432"
    volumes:
      - postgres_shuttle:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuttle"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-seat:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat_dev
      POSTGRES_DB: seat
