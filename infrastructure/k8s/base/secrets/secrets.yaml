apiVersion: v1
kind: Secret
metadata:
  name: travelplatform-secrets
  namespace: travelplatform
type: Opaque
stringData:
  # JWT Secret for authentication
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"

  # Database URLs - update with actual credentials
  SHUTTLE_DATABASE_URL: "postgresql://shuttle:shuttle_pass@postgres-shuttle:5432/shuttle"
  SEAT_DATABASE_URL: "postgresql://seat:seat_pass@postgres-seat:5432/seat"
  PRICING_DATABASE_URL: "postgresql://pricing:pricing_pass@postgres-pricing:5432/pricing"
  BOOKING_DATABASE_URL: "postgresql://booking:booking_pass@postgres-booking:5432/booking"
  PAYMENT_DATABASE_URL: "postgresql://payment:payment_pass@postgres-payment:5432/payment"
  PROMO_DATABASE_URL: "postgresql://promo:promo_pass@postgres-promo:5432/promo"
  NOTIFICATION_DATABASE_URL: "postgresql://notification:notification_pass@postgres-notification:5432/notification"

  # Provider credentials
  TIKETUX_CLIENT_ID: "CHANGE_ME"
  TIKETUX_CLIENT_SECRET: "CHANGE_ME"
  TIKETUX_BASE_URL: "https://api.tiketux.com"

  TRAVELOKA_CLIENT_ID: "CHANGE_ME"
  TRAVELOKA_CLIENT_SECRET: "CHANGE_ME"
  TRAVELOKA_BASE_URL: "https://api.traveloka.com"
