apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: travelplatform
  labels:
    app: notification-service
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: subgraph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/travelplatform/notification-service:latest
          ports:
            - containerPort: 4007
          envFrom:
            - configMapRef:
                name: services-config
            - secretRef:
                name: travelplatform-secrets
          env:
            - name: PORT
              value: "4007"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: travelplatform-secrets
                  key: NOTIFICATION_DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4007
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4007
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
