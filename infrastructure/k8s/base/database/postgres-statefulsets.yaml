---
# PostgreSQL for Shuttle Service
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-shuttle
  namespace: travelplatform
  labels:
    app: postgres-shuttle
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-shuttle
  replicas: 1
  selector:
    matchLabels:
      app: postgres-shuttle
  template:
    metadata:
      labels:
        app: postgres-shuttle
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: shuttle
            - name: POSTGRES_USER
              value: shuttle
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: SHUTTLE_DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-shuttle
  namespace: travelplatform
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-shuttle
