apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelplatform-ingress
  namespace: travelplatform
  annotations:
    # Uncomment to enable TLS via cert-manager once configured:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: app.kadokadi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 4000
  # Uncomment for TLS once cert-manager is configured:
  # tls:
  #   - hosts:
  #       - app.kadokadi.com
  #     secretName: travelplatform-tls
