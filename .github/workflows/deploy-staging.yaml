name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches: [deploy-stg]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: staging
      url: https://staging-api.travelplatform.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Get commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" | cut -c1-7 >> $GITHUB_OUTPUT
          fi

      - name: Update image tags
        run: |
          cd infrastructure/k8s/overlays/staging
          kustomize edit set image \
            ghcr.io/travelplatform/gateway:${{ steps.sha.outputs.sha }} \
            ghcr.io/travelplatform/shuttle-service:${{ steps.sha.outputs.sha }} \
            ghcr.io/travelplatform/seat-service:${{ steps.sha.outputs.sha }} \
            ghcr.io/travelplatform/pricing-service:${{ steps.sha.outputs.sha }} \
            ghcr.io/travelplatform/booking-service:${{ steps.sha.outputs.sha }} \
            ghcr.io/travelplatform/payment-service:${{ steps.sha.outputs.sha }} \
            ghcr.io/travelplatform/promo-service:${{ steps.sha.outputs.sha }} \
            ghcr.io/travelplatform/notification-service:${{ steps.sha.outputs.sha }}

      - name: Deploy to staging
        run: |
          kubectl apply -k infrastructure/k8s/overlays/staging

      - name: Wait for rollout
        run: |
          kubectl -n travelplatform-staging rollout status deployment/gateway --timeout=300s
          kubectl -n travelplatform-staging rollout status deployment/shuttle-service --timeout=300s
          kubectl -n travelplatform-staging rollout status deployment/seat-service --timeout=300s
          kubectl -n travelplatform-staging rollout status deployment/pricing-service --timeout=300s
          kubectl -n travelplatform-staging rollout status deployment/booking-service --timeout=300s
          kubectl -n travelplatform-staging rollout status deployment/payment-service --timeout=300s
          kubectl -n travelplatform-staging rollout status deployment/promo-service --timeout=300s
          kubectl -n travelplatform-staging rollout status deployment/notification-service --timeout=300s

      - name: Health check
        run: |
          sleep 30
          GATEWAY_POD=$(kubectl -n travelplatform-staging get pods -l app=gateway -o jsonpath='{.items[0].metadata.name}')
          kubectl -n travelplatform-staging exec $GATEWAY_POD -- wget -q -O- http://localhost:4000/health || exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "Staging deployment successful!"
          echo "Commit: ${{ steps.sha.outputs.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Staging deployment failed!"
          echo "Check the logs for more details."
