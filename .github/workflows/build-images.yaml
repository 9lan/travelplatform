name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (leave empty for all)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/travelplatform

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      shuttle: ${{ steps.filter.outputs.shuttle }}
      seat: ${{ steps.filter.outputs.seat }}
      pricing: ${{ steps.filter.outputs.pricing }}
      booking: ${{ steps.filter.outputs.booking }}
      payment: ${{ steps.filter.outputs.payment }}
      promo: ${{ steps.filter.outputs.promo }}
      notification: ${{ steps.filter.outputs.notification }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'apps/gateway/**'
              - 'packages/**'
            shuttle:
              - 'apps/shuttle-service/**'
              - 'packages/**'
            seat:
              - 'apps/seat-service/**'
              - 'packages/**'
            pricing:
              - 'apps/pricing-service/**'
              - 'packages/**'
            booking:
              - 'apps/booking-service/**'
              - 'packages/**'
            payment:
              - 'apps/payment-service/**'
              - 'packages/**'
            promo:
              - 'apps/promo-service/**'
              - 'packages/**'
            notification:
              - 'apps/notification-service/**'
              - 'packages/**'

  build-gateway:
    name: Build Gateway
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || github.event.inputs.service == 'gateway' || github.event.inputs.service == ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gateway
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-shuttle-service:
    name: Build Shuttle Service
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shuttle == 'true' || github.event.inputs.service == 'shuttle' || github.event.inputs.service == ''
